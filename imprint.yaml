# Team convention — commit this file.
# Paths are relative to the repo root unless absolute.
# Private runtime lives in gitignored .imprint/ (vault.db, state/, export/).

host:
  listen: 127.0.0.1:9470

telemetry:
  enabled: true
  retention_days: 30

supersede:
  inheritance_alpha: 0.20   # 0=copy old (no decay), 1=drop to 0.6 baseline

shelves:
  enabled: true
  config:
    roots:
      - docs
    # find_top_k: 2         # document hits; independent of find.top_k
    # snippet_runes: 80     # query-window snippet cap
    # max_chunk_lines: 12   # same-section flush; rebuild after change

plugins:
  desk:
    enabled: true   # opt-in: clone imprint-desk-plugin, set enabled: true
    package: ../imprint-desk-plugin
    config:
      port: 4173
      hostUrl: http://127.0.0.1:9470
  embed:
    enabled: true  # opt-in: semantic duplicate gate; degrades to Jaccard when off
    package: ../imprint-embed-sidecar
    config:
      port: 4174
      model: BAAI/bge-small-zh-v1.5   # must match the sidecar model; it keys rule_vectors
      timeout_seconds: 2
      duplicate_threshold: 0.70   # calibrated by imprint-embed-sidecar/calibrate.py; do not raise without re-running it
      # cross_scope_policy: advisory_only   # advisory_only (default) | strict
      #   advisory_only: foreign-scope paraphrases surface as advisory only (recall preserved)
      #   strict:        existing rule must have every tag of the new claim (AND, not overlap)
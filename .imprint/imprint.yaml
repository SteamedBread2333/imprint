# Project imprint home: .imprint/imprint.yaml
# vault defaults to .imprint/memory when omitted.

vault: .imprint/memory

host:
  listen: 127.0.0.1:9470

plugins:
  desk:
    enabled: true
    package: ../imprint-desk-plugin
    config:
      port: 4173
  shelves:
    enabled: true
    package: ../imprint-shelves-plugin
    config:
      port: 4174
      roots:
        - docs

# Shelves index (SQLite) → .imprint/.shelves/.cache/ (derived, gitignore)

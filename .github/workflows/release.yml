name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Dist
        run: VERSION="${GITHUB_REF_NAME#v}" make dist

      - name: Names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          name="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          ver="${GITHUB_REF_NAME#v}"
          echo "image=ghcr.io/${owner}/${name}" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "imprint $GITHUB_REF_NAME"
          --notes "Binaries attached to this release. GitHub Packages: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}. Go: go install github.com/${GITHUB_REPOSITORY}/cmd/imprint@${GITHUB_REF_NAME}. Then: imprint init"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:${{ github.ref_name }}
            ${{ steps.names.outputs.image }}:latest

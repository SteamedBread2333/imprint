# Sync docs/ to the repo's GitHub Wiki (*.wiki.git).
#
# One-time setup (repo owner):
#   1. Settings → Features → enable Wikis
#   2. Settings → Secrets → add WIKI_PUSH_TOKEN (fine-grained PAT with Contents
#      read/write on this repo, or classic PAT with repo scope)
#
# GITHUB_TOKEN alone cannot push to wiki repos on most accounts.
name: wiki

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "README.zh.md"
      - "scripts/sync-wiki.sh"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

concurrency:
  group: wiki-${{ github.repository }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs to GitHub Wiki
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/sync-wiki.sh

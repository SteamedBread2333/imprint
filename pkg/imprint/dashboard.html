<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imprint</title>
<style>
  :root {
    --bg: #14120f;
    --bg-2: #1c1916;
    --bg-3: #26211c;
    --ink: #e8e0d4;
    --muted: #9a9084;
    --line: #3a342c;
    --active: #6f9e72;
    --dormant: #7a736c;
    --superseded: #6b8cae;
    --gold: #c4a574;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-rows: 56px 1fr; }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg-2);
  }
  .brand { font-family: var(--serif); font-size: 20px; letter-spacing: 0.08em; color: var(--gold); }
  .brand small { color: var(--muted); letter-spacing: 0; font-size: 12px; margin-left: 8px; font-family: var(--sans); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
  input, select, button {
    background: var(--bg-3); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: 13px var(--sans);
  }
  button { cursor: pointer; color: var(--gold); }
  button:hover { border-color: var(--gold); }
  input[type="search"] { min-width: 180px; flex: 1; max-width: 280px; }
  .stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
  main { display: grid; grid-template-columns: 240px 1fr 320px; min-height: 0; }
  aside, .detail { background: var(--bg-2); overflow: auto; }
  aside { border-right: 1px solid var(--line); padding: 12px; }
  .detail { border-left: 1px solid var(--line); padding: 16px; }
  #stage { position: relative; min-height: 0; }
  #cy { position: absolute; inset: 0; }
  #overview { position: absolute; inset: 0; overflow: auto; padding: 24px 28px; }
  #overview.hidden, #cy.hidden { display: none; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin: 8px 0 10px; }
  .scope-item, .legend span { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; cursor: pointer; }
  .scope-item:hover { color: var(--gold); }
  .scope-item.active { color: var(--gold); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
  .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .claim { font-family: var(--serif); font-size: 20px; line-height: 1.35; margin: 0 0 12px; }
  .meta { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 16px; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; word-break: break-word; }
  .id { font-family: var(--mono); font-size: 12px; color: var(--gold); }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); margin: 0 4px 4px 0;
  }
  .pill.active { color: var(--active); border-color: var(--active); }
  .pill.dormant { color: var(--dormant); }
  .pill.superseded { color: var(--superseded); border-color: var(--superseded); }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { font-size: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .timeline time { color: var(--muted); font-family: var(--mono); display: block; margin-bottom: 4px; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-left: auto; flex-wrap: wrap; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .swatch.line { height: 2px; width: 16px; border-radius: 0; align-self: center; }
  .swatch.dash { background: repeating-linear-gradient(90deg, #c4a574 0 6px, transparent 6px 10px) !important; height: 2px; }
  .ov-title { font-family: var(--serif); font-size: 28px; margin: 0 0 8px; }
  .ov-lead { color: var(--muted); max-width: 52rem; line-height: 1.5; margin: 0 0 22px; }
  .bars { display: flex; flex-direction: column; gap: 6px; max-width: 52rem; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; cursor: pointer; font-size: 13px; }
  .bar-row:hover .bar-fill { background: var(--gold); }
  .bar-track { height: 8px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--active); }
  .chains { margin-top: 28px; }
  .chain { font-family: var(--mono); font-size: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .warn { color: var(--gold); font-size: 12px; margin: 8px 0 0; }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; grid-template-rows: 180px 1fr 240px; }
    aside, .detail { border: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">imprint <small id="stamp"></small></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search claim or id">
    <select id="status">
      <option value="">all status</option>
      <option value="active">active</option>
      <option value="dormant">dormant</option>
      <option value="superseded">superseded</option>
    </select>
    <select id="conf">
      <option value="0">any confidence</option>
      <option value="0.85">≥ 0.85</option>
      <option value="0.6">≥ 0.60</option>
      <option value="0.3">≥ 0.30</option>
    </select>
    <select id="scopeFilter"><option value="">all scopes</option></select>
    <button id="graphAll" type="button" hidden>graph this slice</button>
    <div class="stats" id="stats"></div>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:var(--active)"></i> active</span>
    <span><i class="swatch" style="background:var(--dormant)"></i> dormant</span>
    <span><i class="swatch" style="background:var(--superseded)"></i> superseded</span>
    <span><i class="swatch" style="background:#c45c4a"></i> supersede</span>
    <span><i class="swatch dash"></i> related</span>
    <span><i class="swatch" style="background:#d4923a"></i> conflict</span>
  </div>
</header>
<main>
  <aside>
    <h2>Scopes</h2>
    <div id="scopes"></div>
  </aside>
  <div id="stage">
    <div id="overview" class="hidden"></div>
    <div id="cy"></div>
  </div>
  <section class="detail" id="detail">
    <p class="empty">This map is for <strong>relationships</strong> — supersede chains, related rules, conflicts — not a spreadsheet of every claim. Pick a scope on the left, then click a node.</p>
  </section>
</main>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script>
const DATA = __IMPRINT_DATA__;
const colors = { active: "#6f9e72", dormant: "#7a736c", superseded: "#6b8cae" };
const MAX_GRAPH = 300;
const OVERVIEW_AT = 40;
let forceGraph = false;

document.getElementById("stamp").textContent = DATA.generated_at ? DATA.generated_at.slice(0, 10) : "";

function visible(n) {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const st = document.getElementById("status").value;
  const conf = parseFloat(document.getElementById("conf").value);
  const sc = document.getElementById("scopeFilter").value;
  if (st && n.status !== st) return false;
  if (n.confidence < conf) return false;
  if (sc && !(n.scope || []).includes(sc)) return false;
  if (q) {
    const hay = (n.id + " " + n.claim + " " + (n.scope || []).join(" ")).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function filtered() { return DATA.nodes.filter(visible); }

const edgeIndex = {};
(DATA.edges || []).forEach(e => {
  edgeIndex[e.source] = (edgeIndex[e.source] || 0) + 1;
  edgeIndex[e.target] = (edgeIndex[e.target] || 0) + 1;
});

const scopeCounts = {};
DATA.nodes.forEach(n => (n.scope || []).forEach(s => { scopeCounts[s] = (scopeCounts[s] || 0) + 1; }));
const scopeList = Object.keys(scopeCounts).sort((a, b) => scopeCounts[b] - scopeCounts[a]);
const scopesEl = document.getElementById("scopes");
const sf = document.getElementById("scopeFilter");
scopeList.forEach(s => {
  const row = document.createElement("div");
  row.className = "scope-item";
  row.dataset.scope = s;
  row.innerHTML = `<span class="dot"></span><span>${s}</span><span class="count">${scopeCounts[s]}</span>`;
  row.onclick = () => {
    sf.value = s;
    forceGraph = false;
    render();
  };
  scopesEl.appendChild(row);
  const opt = document.createElement("option");
  opt.value = s; opt.textContent = `${s} (${scopeCounts[s]})`; sf.appendChild(opt);
});
if (!scopeList.length) scopesEl.innerHTML = '<p class="empty">No scopes yet.</p>';

const cy = cytoscape({
  container: document.getElementById("cy"),
  layout: { name: "circle", padding: 48 },
  style: [
    { selector: "node", style: {
      "background-color": "data(color)",
      "width": "data(size)", "height": "data(size)",
      "label": "data(label)", "color": "#e8e0d4",
      "font-size": 9, "text-wrap": "wrap", "text-max-width": 88,
      "text-valign": "bottom", "text-margin-y": 6, "font-family": "ui-sans-serif, system-ui"
    }},
    { selector: "node:selected", style: { "border-width": 3, "border-color": "#c4a574" } },
    { selector: "edge", style: { "width": 1.5, "curve-style": "bezier", "opacity": 0.85 } },
    { selector: "edge.supersedes", style: { "line-color": "#c45c4a", "target-arrow-color": "#c45c4a", "target-arrow-shape": "triangle" } },
    { selector: "edge.related", style: { "line-color": "#c4a574", "line-style": "dashed", "width": 2, "opacity": 0.95, "target-arrow-shape": "none" } },
    { selector: "edge.conflicts_with", style: { "line-color": "#d4923a", "width": 2, "target-arrow-shape": "none" } }
  ],
  elements: []
});

function pickForGraph(nodes) {
  if (nodes.length <= MAX_GRAPH) return { nodes, truncated: 0 };
  const edged = [];
  const rest = [];
  nodes.forEach(n => (edgeIndex[n.id] ? edged : rest).push(n));
  rest.sort((a, b) => b.confidence - a.confidence);
  const keep = edged.concat(rest).slice(0, MAX_GRAPH);
  return { nodes: keep, truncated: nodes.length - keep.length };
}

function layoutOpts(n) {
  if (n <= 16) return { name: "circle", padding: 56, animate: false };
  if (n <= 80) return { name: "cose", animate: false, padding: 28, nodeRepulsion: 6000 };
  return { name: "concentric", animate: false, minNodeSpacing: 14, padding: 20 };
}

function shortLabel(n) {
  const id = (n.id || "").replace(/^r-/, "");
  const claim = (n.claim || "").trim();
  if (claim.length <= 28) return id + "\n" + claim;
  return id + "\n" + claim.slice(0, 26) + "…";
}

function claimOf(id) {
  const n = DATA.nodes.find(x => x.id === id);
  const c = n ? (n.claim || id) : id;
  return c.length > 48 ? c.slice(0, 46) + "…" : c;
}

function listEdges(kind, empty) {
  const rows = (DATA.edges || []).filter(e => e.kind === kind);
  if (!rows.length) return `<p class="empty">${empty}</p>`;
  return rows.slice(0, 16).map(e =>
    `<div class="chain">${e.source} → ${e.target}<div class="empty">${claimOf(e.source)}</div></div>`
  ).join("") + (rows.length > 16 ? `<p class="empty">+ ${rows.length - 16} more — filter a scope to see them on the graph</p>` : "");
}

function showOverview(nodes) {
  document.getElementById("cy").classList.add("hidden");
  const ov = document.getElementById("overview");
  ov.classList.remove("hidden");
  const c = { active: 0, dormant: 0, superseded: 0 };
  nodes.forEach(n => { c[n.status] = (c[n.status] || 0) + 1; });
  const kinds = { supersedes: 0, related: 0, conflicts_with: 0 };
  (DATA.edges || []).forEach(e => { kinds[e.kind] = (kinds[e.kind] || 0) + 1; });
  const max = Math.max(1, ...scopeList.map(s => scopeCounts[s]));
  const bars = scopeList.slice(0, 24).map(s => {
    const pct = Math.max(2, Math.round(100 * scopeCounts[s] / max));
    return `<div class="bar-row" data-scope="${s}"><span>${s}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="count">${scopeCounts[s]}</span></div>`;
  }).join("");
  ov.innerHTML = `
    <h1 class="ov-title">${DATA.nodes.length} rules</h1>
    <p class="ov-lead">The default view is a census, not the graph. Related / supersede / conflict live on the graph: click a scope on the left, or use <strong>show graph</strong> in the toolbar.</p>
    <p>${c.active || 0} active · ${c.dormant || 0} dormant · ${c.superseded || 0} superseded · <strong>${kinds.related || 0} related</strong> · ${kinds.supersedes || 0} supersede · ${kinds.conflicts_with || 0} conflict</p>
    <h2>Scope mass</h2>
    <div class="bars">${bars}</div>
    <div class="chains"><h2>Related</h2>${listEdges("related", "No related links in frontmatter.")}</div>
    <div class="chains"><h2>Supersede</h2>${listEdges("supersedes", "No supersede chains.")}</div>
    <div class="chains"><h2>Conflict</h2>${listEdges("conflicts_with", "No conflicts_with links.")}</div>
  `;
  ov.querySelectorAll(".bar-row").forEach(row => {
    row.onclick = () => { sf.value = row.dataset.scope; forceGraph = false; render(); };
  });
}

function showGraph(allFiltered) {
  document.getElementById("overview").classList.add("hidden");
  document.getElementById("cy").classList.remove("hidden");
  const picked = pickForGraph(allFiltered);
  const nodes = picked.nodes;
  const ids = new Set(nodes.map(n => n.id));
  const edges = (DATA.edges || []).filter(e => ids.has(e.source) && ids.has(e.target));
  cy.elements().remove();
  cy.add(nodes.map(n => ({
    data: {
      id: n.id,
      label: shortLabel(n),
      color: colors[n.status] || "#888",
      size: 14 + Math.round((n.confidence || 0) * 22),
      payload: n
    }
  })));
  cy.add(edges.map((e, i) => ({
    data: { id: "e" + i, source: e.source, target: e.target },
    classes: e.kind
  })));
  cy.layout(layoutOpts(nodes.length)).run();
  return picked;
}

function render() {
  const sc = sf.value;
  document.querySelectorAll(".scope-item").forEach(el => {
    el.classList.toggle("active", el.dataset.scope === sc);
  });
  const nodes = filtered();
  const c = { active: 0, dormant: 0, superseded: 0 };
  nodes.forEach(n => { c[n.status] = (c[n.status] || 0) + 1; });
  const unfiltered = !sc && !document.getElementById("q").value.trim() && !document.getElementById("status").value && document.getElementById("conf").value === "0";
  const wantOverview = !forceGraph && unfiltered && DATA.nodes.length > OVERVIEW_AT;
  const btn = document.getElementById("graphAll");
  btn.hidden = DATA.nodes.length <= OVERVIEW_AT;
  btn.textContent = wantOverview ? "show graph" : "back to overview";

  let extra = "";
  if (wantOverview) {
    showOverview(nodes);
  } else {
    const picked = showGraph(nodes);
    if (picked.truncated) extra = ` · showing ${picked.nodes.length} of ${nodes.length} (edged + highest confidence)`;
  }
  document.getElementById("stats").textContent =
    `${nodes.length} shown · ${c.active || 0} active · ${c.dormant || 0} dormant · ${c.superseded || 0} superseded${extra}`;
}

function show(n) {
  if (!n) return;
  const ev = (n.evidence_log || []).slice().reverse().map(e =>
    `<li><time>${e.at || ""}</time><strong>${e.kind}</strong> ${e.text ? "— " + e.text : ""}</li>`
  ).join("");
  document.getElementById("detail").innerHTML = `
    <p class="id">${n.id}</p>
    <h1 class="claim">${n.claim}</h1>
    <dl class="meta">
      <dt>status</dt><dd><span class="pill ${n.status}">${n.status}</span></dd>
      <dt>confidence</dt><dd>${(n.confidence || 0).toFixed(2)}</dd>
      <dt>scope</dt><dd>${(n.scope || []).map(s => `<span class="pill">${s}</span>`).join("") || "—"}</dd>
      <dt>reinforced</dt><dd>${n.reinforcement_count || 0}</dd>
      <dt>supersedes</dt><dd>${(n.supersedes || []).join(", ") || "—"}</dd>
      <dt>related</dt><dd>${(n.related || []).map(id => `<span class="pill">${id}</span>`).join("") || "—"}</dd>
    </dl>
    <h2>Evidence</h2>
    <ul class="timeline">${ev || "<li class='empty'>No evidence log.</li>"}</ul>
  `;
}

cy.on("tap", "node", evt => show(evt.target.data("payload")));
document.getElementById("graphAll").onclick = () => {
  forceGraph = !forceGraph;
  render();
};
["q", "status", "conf", "scopeFilter"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => { forceGraph = false; render(); });
  document.getElementById(id).addEventListener("change", () => { forceGraph = false; render(); });
});
render();
if (DATA.nodes.length && DATA.nodes.length <= OVERVIEW_AT) show(DATA.nodes[0]);
</script>
</body>
</html>

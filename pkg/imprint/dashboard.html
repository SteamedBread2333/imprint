<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imprint</title>
<style>
  :root {
    --bg: #100e0c;
    --bg-2: #181511;
    --bg-3: #242018;
    --ink: #f0e7d8;
    --muted: #9a9084;
    --line: #3a342c;
    --active: #7dba82;
    --dormant: #7a736c;
    --superseded: #7aa0c8;
    --gold: #d4b483;
    --gold-2: #e8c99a;
    --super: #e07060;
    --conflict: #e0a04a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2);
  }
  .brand { font-family: var(--serif); font-size: 22px; letter-spacing: 0.1em; color: var(--gold); flex: none; }
  .brand small { color: var(--muted); letter-spacing: 0; font-size: 12px; margin-left: 8px; font-family: var(--sans); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; min-width: 0; }
  input, select, button {
    background: var(--bg-3); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: 13px var(--sans);
  }
  button { cursor: pointer; color: var(--gold); }
  button:hover, button:focus-visible { border-color: var(--gold); outline: none; }
  .view-switch { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
  .view-switch[hidden] { display: none !important; }
  .view-switch button { border: 0; border-radius: 0; }
  .view-switch button.on { background: var(--gold); color: var(--bg); }
  #langBtn {
    flex: none; min-width: 3.2em; letter-spacing: 0.04em;
    margin-left: auto; align-self: flex-start;
  }
  .scroll-panel {
    scrollbar-width: thin;
    scrollbar-color: rgba(212, 180, 131, 0.38) transparent;
  }
  .scroll-panel::-webkit-scrollbar { width: 7px; height: 7px; }
  .scroll-panel::-webkit-scrollbar-track { background: transparent; }
  .scroll-panel::-webkit-scrollbar-thumb {
    background: rgba(212, 180, 131, 0.28);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .scroll-panel::-webkit-scrollbar-thumb:hover { background: rgba(212, 180, 131, 0.48); }
  .scroll-panel::-webkit-scrollbar-corner { background: transparent; }
  .ov-actions { margin: 0 0 22px; }
  input[type="search"] { min-width: 180px; flex: 1; max-width: 280px; }
  .stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #recipe {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--line); background: #14110e;
    font-size: 12px; color: var(--muted);
  }
  #recipe strong { color: var(--gold-2); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px 2px 10px;
    color: var(--ink); background: var(--bg-3);
  }
  .chip button {
    padding: 0 4px; border: 0; background: none; color: var(--muted); font-size: 14px; line-height: 1;
  }
  .chip button:hover { color: var(--gold); }
  .edge-toggle { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  .edge-toggle label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--ink); }
  .edge-toggle input { accent-color: var(--gold); }
  main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; min-height: 0; }
  aside, .detail { background: var(--bg-2); overflow: auto; }
  aside { border-right: 1px solid var(--line); padding: 12px; }
  .detail { border-left: 1px solid var(--line); padding: 16px; }
  #stage { position: relative; min-height: 560px; background:
    radial-gradient(1200px 700px at 50% 40%, #1b1712 0%, #100e0c 70%);
  }
  #stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.35;
    background-image:
      linear-gradient(rgba(196,165,116,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196,165,116,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }
  #cy { position: absolute; inset: 0; z-index: 2; }
  #cy svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #cy svg:active { cursor: grabbing; }
  .d3-ring { fill: none; stroke: rgba(212,180,131,0.18); stroke-dasharray: 2 8; }
  .d3-link { fill: none; }
  .d3-link.related { stroke: #d4b483; stroke-width: 1.35; stroke-dasharray: 5 4; opacity: 0.75; }
  .d3-link.supersedes { stroke: #e07060; stroke-width: 2; opacity: 0.9; }
  .d3-link.conflicts_with { stroke: #e0a04a; stroke-width: 2.2; opacity: 0.9; }
  .d3-link.dim { opacity: 0.08; }
  .d3-node { cursor: pointer; }
  .d3-node.dim { opacity: 0.14; }
  .d3-node.hub circle { stroke: #f0e7d8; stroke-width: 3px; filter: drop-shadow(0 0 10px rgba(232,201,154,0.55)); }
  .d3-node.hot circle { stroke: #f0e7d8; stroke-width: 3px; }
  .d3-label {
    font: 10px var(--sans); fill: #f0e7d8; text-anchor: middle;
    paint-order: stroke; stroke: #100e0c; stroke-width: 3px; pointer-events: none;
  }
  #overview { position: absolute; inset: 0; overflow: auto; padding: 28px 32px; z-index: 2; }
  #overview.hidden, #hud.hidden { display: none; }
  #cy.hidden { visibility: hidden; pointer-events: none; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin: 8px 0 10px; }
  .scope-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 6px; cursor: pointer; border-radius: 6px; }
  .scope-item:hover { background: var(--bg-3); color: var(--gold); }
  .scope-item.active { color: var(--gold); background: #2a241c; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
  .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .claim { font-family: var(--serif); font-size: 20px; line-height: 1.35; margin: 0 0 12px; }
  .meta { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 16px; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; word-break: break-word; }
  .id { font-family: var(--mono); font-size: 12px; color: var(--gold); }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); margin: 0 4px 4px 0;
  }
  .pill.active { color: var(--active); border-color: var(--active); }
  .pill.dormant { color: var(--dormant); }
  .pill.superseded { color: var(--superseded); border-color: var(--superseded); }
  .pill.btn { cursor: pointer; background: none; color: inherit; font: inherit; }
  .pill.btn:hover { border-color: var(--gold); color: var(--gold); }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { font-size: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .timeline time { color: var(--muted); font-family: var(--mono); display: block; margin-bottom: 4px; }
  .ov-title { font-family: var(--serif); font-size: 30px; margin: 0 0 8px; }
  .ov-lead { color: var(--muted); max-width: 52rem; line-height: 1.55; margin: 0 0 22px; }
  .bars { display: flex; flex-direction: column; gap: 6px; max-width: 52rem; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; cursor: pointer; font-size: 13px; }
  .bar-row:hover .bar-fill { background: var(--gold); }
  .bar-track { height: 8px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--active); }
  .chains { margin-top: 28px; }
  .chain { font-family: var(--mono); font-size: 12px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .chain:hover { color: var(--gold); }
  .id-link {
    background: none; border: 0; padding: 0; color: var(--gold);
    font: 12px var(--mono); cursor: pointer; text-decoration: underline;
  }
  .id-link:hover { color: var(--ink); }
  #hud {
    position: absolute; left: 14px; bottom: 14px; z-index: 4;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  }
  #hud .row { display: flex; gap: 6px; pointer-events: auto; }
  kbd {
    font: 11px var(--mono); color: var(--gold-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; background: #1a1612;
  }
  #legend {
    display: flex; flex-direction: column; gap: 10px;
    width: min(248px, calc(100% - 24px)); padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: rgba(24,21,17,0.9); backdrop-filter: blur(8px);
    pointer-events: auto; font-size: 11px; color: var(--muted); line-height: 1.5;
  }
  .legend-head b { color: var(--ink); font-weight: 500; font-size: 12px; }
  .legend-head span { color: var(--muted); }
  .legend-note { font-size: 11px; line-height: 1.55; }
  .legend-edges { display: flex; flex-direction: column; gap: 6px; }
  .edge-key { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .edge-key .swatch { flex: none; margin: 0; }
  .edge-key .swatch.line { width: 22px; height: 0; border-radius: 0; border-top: 2px solid; }
  .edge-key .swatch.line.related { border-color: #d4b483; border-top-style: dashed; }
  .edge-key .swatch.line.super { border-color: var(--super); }
  .edge-key .swatch.line.conflict { border-color: var(--conflict); border-top-width: 2.2px; }
  .help-edges { display: flex; flex-direction: column; gap: 6px; margin: 0 0 8px; }
  .help-card .edge-key { color: var(--ink); }
  .palette {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .palette-dot {
    width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(240,231,216,0.25);
    padding: 0; cursor: pointer; background: var(--gold); flex: none;
  }
  .palette-dot:hover, .palette-dot:focus-visible {
    outline: none; transform: scale(1.25);
    border-color: var(--gold-2);
  }
  .palette-dot.on { box-shadow: 0 0 0 2px var(--gold-2); }
  #legendFocus {
    color: var(--ink); font: 12px var(--sans); line-height: 1.45;
  }
  #legendFocus:empty { display: none; }
  #legendFocus .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  #tip {
    position: fixed; z-index: 20; max-width: 360px; padding: 10px 12px;
    background: #1c1814; border: 1px solid var(--gold); border-radius: 8px;
    font-size: 12px; line-height: 1.45; pointer-events: none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45); display: none;
  }
  #tip .tid { font-family: var(--mono); color: var(--gold); font-size: 11px; margin-bottom: 4px; }
  #helpPanel {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(8,7,6,0.62);
  }
  #helpPanel.open { display: grid; place-items: center; padding: 24px; }
  .help-card {
    width: min(720px, 100%); max-height: min(88vh, 820px); overflow: auto;
    background: var(--bg-2); border: 1px solid var(--gold); border-radius: 12px; padding: 24px 28px;
  }
  .help-card h1 { font-family: var(--serif); font-size: 26px; margin: 0 0 8px; color: var(--gold-2); }
  .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin-top: 16px; }
  .help-card dt { color: var(--gold); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .help-card dd { margin: 0 0 12px; color: var(--ink); font-size: 13px; line-height: 1.5; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .swatch.dash { width: 16px; height: 2px; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, transparent 6px 10px); }
  .keylist { font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; grid-template-rows: 160px minmax(520px, 1fr) minmax(220px, auto); }
    aside, .detail { border: 0; border-top: 1px solid var(--line); }
    .help-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">imprint <small id="stamp"></small></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search claim, id, or scope" aria-label="Search" data-i18n-placeholder="search_ph" data-i18n-aria="search_aria">
    <select id="status" aria-label="Status" data-i18n-aria="status_aria">
      <option value="" data-i18n="status_all">all status</option>
      <option value="active" data-i18n="status_active">active</option>
      <option value="dormant" data-i18n="status_dormant">dormant</option>
      <option value="superseded" data-i18n="status_superseded">superseded</option>
    </select>
    <select id="conf" aria-label="Minimum confidence" data-i18n-aria="conf_aria">
      <option value="0" data-i18n="conf_any">any confidence</option>
      <option value="0.85">≥ 0.85</option>
      <option value="0.6">≥ 0.60</option>
      <option value="0.3">≥ 0.30</option>
    </select>
    <select id="scopeFilter" aria-label="Scope" data-i18n-aria="scope_aria"><option value="" data-i18n="scope_all">all scopes</option></select>
    <div class="view-switch" id="viewSwitch" role="group" aria-label="Home view" data-i18n-aria="view_aria">
      <button type="button" id="viewList" title="Census" aria-pressed="true" data-i18n="view_list" data-i18n-title="view_list_title">list</button>
      <button type="button" id="viewMap" title="All nodes on the graph" aria-pressed="false" data-i18n="view_map" data-i18n-title="view_map_title">graph</button>
    </div>
    <button id="fitBtn" type="button" title="Fit graph (F)" data-i18n="fit" data-i18n-title="fit_title">fit</button>
    <button id="labelBtn" type="button" title="Cycle label mode" data-i18n-title="labels_title">labels: auto</button>
    <button id="helpBtn" type="button" title="Help (?)" data-i18n-title="help_title_btn">?</button>
    <div class="stats" id="stats"></div>
  </div>
  <button id="langBtn" type="button" title="中文">中文</button>
</header>
<div id="recipe">
  <span id="recipeText">Loading…</span>
  <button id="clearBtn" type="button" data-i18n="clear">clear</button>
  <span class="edge-toggle">
    <label><input type="checkbox" id="eRelated" checked> <span data-i18n="related">related</span></label>
    <label><input type="checkbox" id="eSuper" checked> <span data-i18n="super">supersede</span></label>
    <label><input type="checkbox" id="eConflict" checked> <span data-i18n="conflict">conflict</span></label>
  </span>
</div>
<main>
  <aside class="scroll-panel">
    <h2 data-i18n="scopes">Scopes</h2>
    <p class="empty" id="scopesHint" data-i18n="scopes_hint">A tag keeps rules that include it. Filters stack.</p>
    <div id="scopes"></div>
  </aside>
  <div id="stage">
    <div id="overview" class="hidden scroll-panel"></div>
    <div id="cy"></div>
    <div id="hud" class="hidden">
      <div id="legend">
        <div class="legend-head"><b data-i18n="legend_title">Relation graph</b> · <span data-i18n="legend_sub">colour is scope</span></div>
        <div id="legendScopes" class="palette" role="list"></div>
        <div id="legendFocus"></div>
        <div class="legend-edges">
          <div class="edge-key"><span class="swatch line related" aria-hidden="true"></span><span data-i18n="related">related</span></div>
          <div class="edge-key"><span class="swatch line super" aria-hidden="true"></span><span data-i18n="super">supersede</span></div>
          <div class="edge-key"><span class="swatch line conflict" aria-hidden="true"></span><span data-i18n="conflict">conflict</span></div>
        </div>
        <div class="legend-note" id="legendNodes"></div>
      </div>
      <div class="row">
        <button type="button" id="zoomOut">−</button>
        <button type="button" id="zoomIn">+</button>
      </div>
    </div>
  </div>
  <section class="detail scroll-panel" id="detail">
    <p class="empty" id="detailEmpty"></p>
  </section>
</main>
<div id="tip" role="tooltip"></div>
<div id="helpPanel" role="dialog" aria-labelledby="helpTitle" hidden>
  <div class="help-card scroll-panel">
    <h1 id="helpTitle"></h1>
    <p class="empty" id="helpLead"></p>
    <div class="help-grid" id="helpGrid"></div>
    <p style="margin:18px 0 0;text-align:right"><button type="button" id="helpClose"></button></p>
  </div>
</div>
<script>__D3_JS__</script>

function dandelionLayout(nodes, edges) {
  const ids = nodes.map(n => n.id);
  const idset = new Set(ids);
  const adj = {};
  ids.forEach(id => { adj[id] = []; });
  edges.forEach(e => {
    if (!idset.has(e.source) || !idset.has(e.target) || e.source === e.target) return;
    adj[e.source].push(e.target);
    adj[e.target].push(e.source);
  });
  const deg = id => (adj[id] || []).length;
  const seen = new Set();
  const comps = [];
  ids.forEach(id => {
    if (seen.has(id)) return;
    const q = [id];
    seen.add(id);
    const comp = [];
    while (q.length) {
      const u = q.shift();
      comp.push(u);
      (adj[u] || []).forEach(v => {
        if (!seen.has(v)) { seen.add(v); q.push(v); }
      });
    }
    comps.push(comp);
  });
  comps.sort((a, b) => b.length - a.length);
  const pos = {};
  const hubs = [];
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });
  const sortRing = ring => ring.sort((a, b) => {
    const sa = parentScope(byId[a] || {}) || "";
    const sb = parentScope(byId[b] || {}) || "";
    return sa === sb ? a.localeCompare(b) : sa.localeCompare(sb);
  });
  const depthsByHub = {};
  function placeComp(comp, ox, oy, scale) {
    let root = comp[0];
    comp.forEach(id => { if (deg(id) > deg(root)) root = id; });
    if (selectedId && comp.indexOf(selectedId) >= 0) root = selectedId;
    hubs.push(root);
    const depth = {};
    depth[root] = 0;
    const q = [root];
    while (q.length) {
      const u = q.shift();
      (adj[u] || []).forEach(v => {
        if (depth[v] === undefined && comp.indexOf(v) >= 0) {
          depth[v] = depth[u] + 1;
          q.push(v);
        }
      });
    }
    comp.forEach(id => { if (depth[id] === undefined) depth[id] = 1; });
    depthsByHub[root] = depth;
    const rings = {};
    comp.forEach(id => {
      const d = depth[id];
      (rings[d] = rings[d] || []).push(id);
    });
    Object.keys(rings).forEach(d => sortRing(rings[d]));
    const baseR = 70 * scale;
    let maxR = 0;
    comp.forEach(id => {
      const d = depth[id];
      if (d === 0) {
        pos[id] = { x: ox, y: oy };
        return;
      }
      const ring = rings[d];
      const i = ring.indexOf(id);
      const n = Math.max(ring.length, 1);
      const angle = (2 * Math.PI * i) / n - Math.PI / 2;
      const radius = d * baseR * (1 + Math.min(n, 28) / 40);
      maxR = Math.max(maxR, radius);
      pos[id] = { x: ox + Math.cos(angle) * radius, y: oy + Math.sin(angle) * radius };
    });
    return maxR;
  }
  const linked = comps.filter(c => c.length > 1);
  const isolates = comps.filter(c => c.length === 1).map(c => c[0]);
  let maxR = 80;
  if (!linked.length) {
    const n = Math.max(isolates.length, 1);
    isolates.forEach((id, i) => {
      const angle = (2 * Math.PI * i) / n - Math.PI / 2;
      const radius = 28 + Math.min(n, 36) * 4;
      pos[id] = { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
      maxR = Math.max(maxR, radius);
    });
    if (isolates[0]) hubs.push(isolates[0]);
  } else if (linked.length === 1) {
    maxR = Math.max(maxR, placeComp(linked[0], 0, 0, 1));
    isolates.forEach((id, i) => {
      const n = Math.max(isolates.length, 1);
      const angle = (2 * Math.PI * i) / n - Math.PI / 2;
      const radius = maxR + 52;
      pos[id] = { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius };
      maxR = radius;
    });
  } else {
    const spread = 220;
    linked.forEach((comp, i) => {
      const angle = (2 * Math.PI * i) / linked.length - Math.PI / 2;
      const r = placeComp(comp, Math.cos(angle) * spread, Math.sin(angle) * spread, 0.72);
      maxR = Math.max(maxR, spread + r);
    });
    isolates.forEach((id, i) => {
      const n = Math.max(isolates.length, 1);
      const angle = (2 * Math.PI * i) / n;
      pos[id] = { x: Math.cos(angle) * spread * 1.6, y: Math.sin(angle) * spread * 1.6 };
    });
  }
  const ringSet = new Set();
  Object.keys(pos).forEach(id => {
    const p = pos[id];
    const r = Math.hypot(p.x, p.y);
    if (r > 20) ringSet.add(Math.round(r / 8) * 8);
  });
  return { pos, hubs, maxR: maxR + 24, rings: [...ringSet].sort((a, b) => a - b) };
}

  const n = graphNodes.length;
  gNodes.selectAll(".d3-node").each(function(d) {
    const on = labelMode === "on" || d.hub || d.id === selectedId || d.hot
      || (labelMode === "auto" && (n <= 14 || zoomK >= 1.15));
    d3.select(this).select("text").style("opacity", on ? 1 : 0);
  });
}
function fitGraph() {
  const { w, h } = sizeHost();
  const pad = 80;
  const k = Math.max(0.12, Math.min(4, Math.min(w, h) / (2 * laidMaxR + pad)));
  svg.transition().duration(420).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k));
}
function showGraph(allFiltered) {
  document.getElementById("overview").classList.add("hidden");
  host.classList.remove("hidden");
  document.getElementById("hud").classList.remove("hidden");
  const picked = pickForGraph(allFiltered);
  const nodes = picked.nodes;
  const ids = new Set(nodes.map(n => n.id));
  const edges = (DATA.edges || []).filter(e => ids.has(e.source) && ids.has(e.target) && edgeOn(e.kind));
  const laid = dandelionLayout(nodes, edges);
  laidMaxR = laid.maxR;
  const hubSet = new Set(laid.hubs);
  graphNodes = nodes.map(n => Object.assign({}, n, laid.pos[n.id] || { x: 0, y: 0 }, {
    hub: hubSet.has(n.id),
    r: 7 + Math.round((n.confidence || 0) * 10) + (hubSet.has(n.id) ? 6 : 0),
    fill: scopeColor(parentScope(n)),
    stroke: statusBorder[n.status] || "#9a9084",
    hot: false
  }));
  const byId = {};
  graphNodes.forEach(n => { byId[n.id] = n; });
  const legendNames = [];
  const legendSeen = new Set();
  graphNodes.forEach(n => {
    const s = parentScope(n);
    if (!s || legendSeen.has(s)) return;
    legendSeen.add(s);
    legendNames.push(s);
  });
  legendNames.sort((a, b) => (scopeCounts[b] || 0) - (scopeCounts[a] || 0));
  paintLegend(legendNames);
  graphLinks = edges.filter(e => byId[e.source] && byId[e.target]).map(e => ({
    source: byId[e.source], target: byId[e.target], kind: e.kind
  }));
  gRings.selectAll("circle").data(laid.rings).join("circle")
    .attr("class", "d3-ring")
    .attr("r", d => d);
  gLinks.selectAll("line").data(graphLinks).join("line")
    .attr("class", d => "d3-link " + d.kind)
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y)
    .attr("marker-end", d => d.kind === "supersedes" ? "url(#arrow-super)" : null);
  const sel = gNodes.selectAll("g.d3-node").data(graphNodes, d => d.id);
  sel.exit().remove();
  const enter = sel.enter().append("g").attr("class", "d3-node");
  enter.append("circle");
  enter.append("text").attr("class", "d3-label").attr("dy", d => d.r + 12);
  const all = enter.merge(sel);
  all.attr("transform", d => `translate(${d.x},${d.y})`)
    .classed("hub", d => d.hub)
    .classed("hot", d => d.id === selectedId)
    .on("click", (ev, d) => {
      ev.stopPropagation();
      const wasHub = d.hub && selectedId === d.id;
      selectedId = d.id;
      show(d);
      if (!wasHub) commit("push");
      else pushQuery();
    })
    .on("mouseenter", (ev, d) => spotlight(d, ev))
    .on("mouseleave", () => { clearDim(); hideTip(); });
  all.select("circle")
    .attr("r", d => d.r)
    .attr("fill", d => d.fill)
    .attr("stroke", d => d.stroke)
    .attr("stroke-width", d => d.status === "superseded" ? 3 : 2);
  all.select("text").each(function(d) {
    const lines = shortLabel(d).split("\n");
    const t = d3.select(this);
    t.selectAll("tspan").data(lines).join("tspan")
      .attr("x", 0)
      .attr("dy", (line, i) => i === 0 ? 0 : 12)
      .text(line => line);
  });
  sizeHost();
  fitGraph();
  applyLabelOpacity();
  if (selectedId) {
    const n = graphNodes.find(x => x.id === selectedId);
    if (n) show(n);
  }
  return picked;
}

function recipe() {
  const parts = [];
  const q = document.getElementById("q").value.trim();
  const st = document.getElementById("status").value;
  const conf = parseFloat(document.getElementById("conf").value);
  const sc = sf.value;
  if (q) parts.push(`<span class="chip">${t("chip_search")} “${esc(q)}” <button type="button" data-clear="q" aria-label="${t("clear")}">×</button></span>`);
  if (st) parts.push(`<span class="chip">${t("chip_status")} ${esc(st)} <button type="button" data-clear="status">×</button></span>`);
  if (conf > 0) parts.push(`<span class="chip">${t("chip_conf")} ≥ ${conf} <button type="button" data-clear="conf">×</button></span>`);
  if (sc) parts.push(`<span class="chip">${t("chip_scope")} ${esc(sc)} <button type="button" data-clear="scopeFilter">×</button></span>`);
  const off = [];
  if (!document.getElementById("eRelated").checked) off.push(t("related"));
  if (!document.getElementById("eSuper").checked) off.push(t("super"));
  if (!document.getElementById("eConflict").checked) off.push(t("conflict"));
  if (off.length) parts.push(`<span class="chip">${t("chip_hiding")} ${off.join(", ")}</span>`);
  const text = document.getElementById("recipeText");
  if (!parts.length) {
    text.innerHTML = viewMode === "graph" ? t("recipe_home_map") : t("recipe_home_list");
  } else {
    text.innerHTML = `<strong>${t("recipe_match")}</strong> ` + parts.join(" ");
  }
  text.querySelectorAll("[data-clear]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-clear");
      const el = document.getElementById(id);
      if (el) el.value = id === "conf" ? "0" : "";
      commit("push");
    };
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function render() {
  recipe();
  const sc = sf.value;
  document.querySelectorAll(".scope-item").forEach(el => {
    el.classList.toggle("active", el.dataset.scope === sc);
  });
  const nodes = filtered();
  const c = { active: 0, dormant: 0, superseded: 0 };
  nodes.forEach(n => { c[n.status] = (c[n.status] || 0) + 1; });
  const unfiltered = isHome();
  const wantOverview = viewMode === "list" && unfiltered;
  const switchEl = document.getElementById("viewSwitch");
  switchEl.hidden = !unfiltered;
  document.getElementById("viewList").classList.toggle("on", viewMode === "list");
  document.getElementById("viewMap").classList.toggle("on", viewMode === "graph");
  document.getElementById("viewList").setAttribute("aria-pressed", viewMode === "list" ? "true" : "false");
  document.getElementById("viewMap").setAttribute("aria-pressed", viewMode === "graph" ? "true" : "false");
  let extra = "";
  if (wantOverview) {
    showOverview(nodes);
  } else {
    const next = sc ? localSlice(nodes) : nodes;
    const picked = showGraph(next);
    if (picked.truncated) extra = " · " + t("showing", { a: picked.nodes.length, b: next.length });
    else if (sc && next.length > nodes.length) extra = " · " + t("nearby", { n: next.length - nodes.length });
  }
  document.getElementById("stats").textContent =
    t("stats", { n: nodes.length, active: c.active || 0, dormant: c.dormant || 0, superseded: c.superseded || 0 }) + extra;
  document.getElementById("labelBtn").textContent = t("labels") + ": " + labelMode;
}
function hideTip() { document.getElementById("tip").style.display = "none"; }
function showTip(n, ev) {
  if (!n) return;
  const tip = document.getElementById("tip");
  const scopes = (n.scope || []).join(", ") || "—";
  tip.innerHTML = `<div class="tid">${esc(n.id)} · ${esc(n.status)} · ${(n.confidence || 0).toFixed(2)}</div>${esc(n.claim || "")}<div class="empty" style="margin-top:6px">${esc(scopes)}</div>`;
  tip.style.display = "block";
  tip.style.left = Math.min((ev.clientX || 0) + 14, window.innerWidth - 380) + "px";
  tip.style.top = Math.min((ev.clientY || 0) + 14, window.innerHeight - 160) + "px";
}
function jump(id) {
  const n = DATA.nodes.find(x => x.id === id);
  if (!n) return;
  selectedId = id;
  viewMode = "graph";
  if (n.scope && n.scope[0] && !sf.value) sf.value = n.scope[0];
  commit("push");
  show(n);
}
function idLinks(ids) {
  if (!ids || !ids.length) return "—";
  return ids.map(id => `<button type="button" class="id-link" data-id="${id}">${id}</button>`).join(" ");
}
function show(n) {
  if (!n) return;
  selectedId = n.id;
  const ev = (n.evidence_log || []).slice().reverse().map(e =>
    `<li><time>${esc(e.at || "")}</time><strong>${esc(e.kind)}</strong> ${e.text ? "— " + esc(e.text) : ""}</li>`
  ).join("");
  const back = (n.referenced_by || []).map(b =>
    `<button type="button" class="id-link" data-id="${b.id}">${esc(b.id)}</button> <span class="empty">${esc(b.kind)}</span>`
  ).join("<br>");
  document.getElementById("detail").innerHTML = `
    <p class="id">${esc(n.id)}</p>
    <h1 class="claim">${esc(n.claim)}</h1>
    <dl class="meta">
      <dt>${t("meta_status")}</dt><dd><span class="pill ${esc(n.status)}">${esc(n.status)}</span></dd>
      <dt>${t("meta_conf")}</dt><dd>${(n.confidence || 0).toFixed(2)} <span class="empty">${t("node_size")}</span></dd>
      <dt>${t("meta_scope")}</dt><dd>${(n.scope || []).map(s => `<button type="button" class="pill btn" data-scope="${esc(s)}" style="border-color:${scopeColor(s)}">${esc(s)}</button>`).join("") || "—"}</dd>
      <dt>${t("meta_reinf")}</dt><dd>${n.reinforcement_count || 0}</dd>
      <dt>${t("meta_super")}</dt><dd>${idLinks(n.supersedes)}</dd>
      <dt>${t("meta_related")}</dt><dd>${idLinks(n.related)}</dd>
      <dt>${t("meta_back")}</dt><dd>${back || "—"}</dd>
    </dl>
    <h2>${t("evidence")}</h2>
    <ul class="timeline">${ev || "<li class='empty'>" + t("evidence_empty") + "</li>"}</ul>
  `;
  document.getElementById("detail").querySelectorAll(".id-link").forEach(btn => {
    btn.onclick = () => jump(btn.dataset.id);
  });
  document.getElementById("detail").querySelectorAll("[data-scope]").forEach(btn => {
    btn.onclick = () => openGraph(btn.getAttribute("data-scope"));
  });
}
function clearDim() {
  gNodes.selectAll(".d3-node").classed("dim", false).classed("hot", d => d.id === selectedId);
  gLinks.selectAll("line").classed("dim", false);
}
function spotlight(d, ev) {
  const neigh = new Set([d.id]);
  graphLinks.forEach(l => {
    if (l.source.id === d.id) neigh.add(l.target.id);
    if (l.target.id === d.id) neigh.add(l.source.id);
  });
  gNodes.selectAll(".d3-node").classed("dim", n => !neigh.has(n.id)).classed("hot", n => n.id === d.id);
  gLinks.selectAll("line").classed("dim", l => l.source.id !== d.id && l.target.id !== d.id);
  showTip(d, ev);
}

document.getElementById("viewList").onclick = () => { viewMode = "list"; commit("push"); };
document.getElementById("viewMap").onclick = () => { viewMode = "graph"; commit("push"); };
document.getElementById("clearBtn").onclick = () => {
  document.getElementById("q").value = "";
  document.getElementById("status").value = "";
  document.getElementById("conf").value = "0";
  sf.value = "";
  document.getElementById("eRelated").checked = true;
  document.getElementById("eSuper").checked = true;
  document.getElementById("eConflict").checked = true;
  selectedId = null;
  commit("push");
};
document.getElementById("langBtn").onclick = () => {
  lang = lang === "en" ? "zh" : "en";
  applyLang();
  commit("push");
};
document.getElementById("fitBtn").onclick = () => fitGraph();
window.addEventListener("resize", () => { sizeHost(); fitGraph(); });
document.getElementById("zoomIn").onclick = () => svg.transition().duration(180).call(zoom.scaleBy, 1.2);
document.getElementById("zoomOut").onclick = () => svg.transition().duration(180).call(zoom.scaleBy, 1 / 1.2);
document.getElementById("labelBtn").onclick = () => {
  labelMode = labelMode === "auto" ? "on" : labelMode === "on" ? "off" : "auto";
  document.getElementById("labelBtn").textContent = t("labels") + ": " + labelMode;
  applyLabelOpacity();
  pushQuery();
};
function setHelp(open) {
  const p = document.getElementById("helpPanel");
  p.classList.toggle("open", open);
  p.hidden = !open;
}
document.getElementById("helpBtn").onclick = () => setHelp(true);
document.getElementById("helpClose").onclick = () => setHelp(false);
document.getElementById("helpPanel").onclick = e => { if (e.target.id === "helpPanel") setHelp(false); };
let searchTimer = null;
document.getElementById("q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => commit("push"), 320);
});
["status", "conf", "scopeFilter", "eRelated", "eSuper", "eConflict"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("change", () => commit("push"));
});
window.addEventListener("popstate", e => {
  applyQuery(e.state && e.state.qs != null ? e.state.qs : location.search.slice(1));
  applyLang();
  render();
});
document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA")) {
    if (e.key === "Escape") { e.target.blur(); return; }
    return;
  }
  if (e.key === "?" || (e.key === "/" && e.shiftKey)) { e.preventDefault(); setHelp(!document.getElementById("helpPanel").classList.contains("open")); }
  else if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); }
  else if (e.key === "f" || e.key === "F") { fitGraph(); }
  else if (e.key === "l" || e.key === "L") { document.getElementById("labelBtn").click(); }
  else if (e.key === "Escape") {
    if (document.getElementById("helpPanel").classList.contains("open")) setHelp(false);
    else document.getElementById("clearBtn").click();
  }
});

applyQuery(location.search.slice(1));
applyLang();
commit("replace");
if (selectedId) {
  const n = DATA.nodes.find(x => x.id === selectedId);
  if (n) show(n);
} else if (DATA.nodes.length && DATA.nodes.length <= OVERVIEW_AT) {
  show(DATA.nodes[0]);
}
</script>
</body>
</html>

# Copy to .imprint/imprint.yaml at your project root.
# Paths are relative to the repo root unless absolute.

vault: .imprint/memory

host:
  listen: 127.0.0.1:9470

plugins:
  desk:
    enabled: false   # opt-in: clone imprint-desk-plugin, set enabled: true
    package: ../imprint-desk-plugin
    config:
      port: 4173

  shelves:
    enabled: false   # opt-in: clone imprint-shelves-plugin, set enabled: true
    package: ../imprint-shelves-plugin
    config:
      port: 4174
      roots:
        - docs
        - .cursor/skills
